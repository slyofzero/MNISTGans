<svg width="100%" height="auto" viewBox="0 0 940 440" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrowTerracotta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#E07A5F" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#B5B0A6" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#4DABCF" />
    </marker>

    <!-- Subtle Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F7F6F2" />
      <stop offset="100%" stop-color="#E07A5F" />
    </linearGradient>

    <linearGradient id="genBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#363C42" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="discBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DABCF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#363C42" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', Consolas, Menlo, Monaco, monospace; }
  </style>

  <!-- Canvas Base -->
  <rect width="940" height="440" rx="10" fill="#191C1E" stroke="#363C42" stroke-width="1"/>

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(30, 20)">
    <rect width="180" height="20" rx="4" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="90" y="14" fill="#E07A5F" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.8" class="font-sans">cGAN DATAFLOW &amp; ARCHITECTURE</text>
    
    <text x="200" y="15" fill="#F7F6F2" font-size="13.5" font-weight="600" class="font-sans">End-to-End Conditioning &amp; Adversarial Pipeline</text>
    <text x="910" y="14" fill="#9E998F" font-size="10" text-anchor="end" class="font-mono">z_dim=64 • classes=10 • img_dim=784</text>
  </g>

  <line x1="30" y1="50" x2="910" y2="50" stroke="#2D3339" stroke-width="1"/>

  <!-- ==================== COLUMN 1: INPUT CONDITIONING ==================== -->
  <!-- Latent Vector Box -->
  <g transform="translate(30, 70)">
    <rect width="140" height="58" rx="6" fill="#23272B" stroke="#363C42" stroke-width="1"/>
    <rect x="10" y="8" width="70" height="16" rx="3" fill="#2D3339"/>
    <text x="45" y="19" fill="#F7F6F2" font-size="8.5" font-weight="600" text-anchor="middle" class="font-mono">LATENT NOISE</text>
    <text x="10" y="44" fill="#F7F6F2" font-size="11.5" font-weight="600" class="font-mono">z ~ N(0, I)</text>
    <text x="130" y="44" fill="#9E998F" font-size="10" text-anchor="end" class="font-mono">dim: 64</text>
  </g>

  <!-- Target Class Label Box -->
  <g transform="translate(30, 142)">
    <rect width="140" height="58" rx="6" fill="#23272B" stroke="#E07A5F" stroke-width="1" stroke-opacity="0.8"/>
    <rect x="10" y="8" width="75" height="16" rx="3" fill="#2D3339"/>
    <text x="47.5" y="19" fill="#E07A5F" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">CLASS LABEL</text>
    <text x="10" y="44" fill="#F7F6F2" font-size="11.5" font-weight="600" class="font-mono">y ∈ {0..9}</text>
    <text x="130" y="44" fill="#E07A5F" font-size="10" text-anchor="end" class="font-mono">One-Hot (10)</text>
  </g>

  <!-- Real MNIST Dataset Box -->
  <g transform="translate(30, 240)">
    <rect width="140" height="68" rx="6" fill="#23272B" stroke="#363C42" stroke-width="1"/>
    <rect x="10" y="8" width="85" height="16" rx="3" fill="#2D3339"/>
    <text x="52.5" y="19" fill="#4DABCF" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">REAL DATASET</text>
    <text x="10" y="44" fill="#F7F6F2" font-size="11.5" font-weight="600" class="font-sans">MNIST Real x</text>
    <text x="10" y="58" fill="#9E998F" font-size="9" class="font-mono">28×28 Grayscale</text>
    <text x="130" y="58" fill="#9E998F" font-size="10" text-anchor="end" class="font-mono">dim: 784</text>
  </g>

  <!-- Real Class Label Box -->
  <g transform="translate(30, 322)">
    <rect width="140" height="58" rx="6" fill="#23272B" stroke="#4DABCF" stroke-width="1" stroke-opacity="0.7"/>
    <rect x="10" y="8" width="95" height="16" rx="3" fill="#2D3339"/>
    <text x="57.5" y="19" fill="#4DABCF" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">REAL CLASS y_real</text>
    <text x="10" y="44" fill="#F7F6F2" font-size="11.5" font-weight="600" class="font-mono">y_real ∈ {0..9}</text>
    <text x="130" y="44" fill="#4DABCF" font-size="10" text-anchor="end" class="font-mono">One-Hot (10)</text>
  </g>

  <!-- Connectors: z and y to Concat -->
  <path d="M 170 99 L 205 99 L 205 125 L 218 125" stroke="#B5B0A6" stroke-width="1.2" fill="none" marker-end="url(#arrowMuted)"/>
  <path d="M 170 171 L 205 171 L 205 145 L 218 145" stroke="#E07A5F" stroke-width="1.2" fill="none" marker-end="url(#arrowTerracotta)"/>

  <!-- Concatenation Pill (Generator) -->
  <g transform="translate(225, 120)">
    <rect width="32" height="30" rx="4" fill="#2D3339" stroke="#E07A5F" stroke-width="1"/>
    <text x="16" y="20" fill="#E07A5F" font-size="14" font-weight="700" text-anchor="middle" class="font-mono">[ ; ]</text>
    <text x="16" y="42" fill="#9E998F" font-size="8.5" text-anchor="middle" class="font-mono">74-d</text>
  </g>
  <path d="M 257 135 L 285 135" stroke="#E07A5F" stroke-width="1.2" fill="none" marker-end="url(#arrowTerracotta)"/>

  <!-- ==================== COLUMN 2: GENERATOR NETWORK ==================== -->
  <g transform="translate(290, 65)">
    <!-- Container -->
    <rect width="210" height="152" rx="8" fill="#23272B" stroke="url(#genBorder)" stroke-width="1.2"/>
    <rect x="0" y="0" width="210" height="3" rx="1" fill="#E07A5F"/>

    <!-- Title Badge -->
    <rect x="12" y="10" width="105" height="18" rx="3" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="64.5" y="22.5" fill="#E07A5F" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5" class="font-sans">GENERATOR G(z, y)</text>

    <!-- Layers -->
    <g transform="translate(12, 38)">
      <!-- Layer 1 -->
      <rect width="186" height="26" rx="4" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="10" y="17" fill="#F7F6F2" font-size="10" font-weight="600" class="font-mono">Linear (74 → 256)</text>
      <text x="176" y="17" fill="#E07A5F" font-size="9" text-anchor="end" class="font-mono">LeakyReLU</text>

      <!-- Layer 2 -->
      <rect y="32" width="186" height="26" rx="4" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="10" y="49" fill="#F7F6F2" font-size="10" font-weight="600" class="font-mono">Linear (256 → 512)</text>
      <text x="176" y="49" fill="#E07A5F" font-size="9" text-anchor="end" class="font-mono">LeakyReLU</text>

      <!-- Layer 3 -->
      <rect y="64" width="186" height="26" rx="4" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="10" y="81" fill="#F7F6F2" font-size="10" font-weight="600" class="font-mono">Linear (512 → 784)</text>
      <text x="176" y="81" fill="#E07A5F" font-size="9" text-anchor="end" class="font-mono">Tanh [-1, 1]</text>

      <!-- Reshape note -->
      <text x="93" y="105" fill="#9E998F" font-size="9" text-anchor="middle" class="font-mono">reshape: (B, 1, 28, 28)</text>
    </g>
  </g>

  <!-- Output Arrow to Synthetic Image -->
  <path d="M 500 141 L 535 141" stroke="#E07A5F" stroke-width="1.2" fill="none" marker-end="url(#arrowTerracotta)"/>

  <!-- Synthetic Image Box -->
  <g transform="translate(542, 107)">
    <rect width="90" height="68" rx="6" fill="#23272B" stroke="#E07A5F" stroke-width="1"/>
    <text x="45" y="24" fill="#E07A5F" font-size="9.5" font-weight="700" text-anchor="middle" class="font-mono">SYNTHETIC</text>
    <text x="45" y="42" fill="#F7F6F2" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">x_fake = G(z,y)</text>
    <text x="45" y="58" fill="#9E998F" font-size="9" text-anchor="middle" class="font-mono">28×28 (784-d)</text>
  </g>

  <!-- Connectors to Discriminator Concat -->
  <!-- Synthetic image branch -->
  <path d="M 632 141 L 665 141 L 665 240 L 678 240" stroke="#E07A5F" stroke-width="1.2" fill="none" marker-end="url(#arrowTerracotta)"/>
  
  <!-- Real image branch -->
  <path d="M 170 274 L 665 274 L 665 255 L 678 255" stroke="#4DABCF" stroke-width="1.2" fill="none" marker-end="url(#arrowCyan)"/>

  <!-- Condition Label to Discriminator -->
  <path d="M 170 351 L 655 351 L 655 265 L 678 265" stroke="#B5B0A6" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrowMuted)"/>

  <!-- Concatenation Pill (Discriminator) -->
  <g transform="translate(685, 238)">
    <rect width="32" height="30" rx="4" fill="#2D3339" stroke="#4DABCF" stroke-width="1"/>
    <text x="16" y="20" fill="#4DABCF" font-size="14" font-weight="700" text-anchor="middle" class="font-mono">[ ; ]</text>
    <text x="16" y="42" fill="#9E998F" font-size="8.5" text-anchor="middle" class="font-mono">794-d</text>
  </g>
  <path d="M 717 253 L 735 253" stroke="#4DABCF" stroke-width="1.2" fill="none" marker-end="url(#arrowCyan)"/>

  <!-- ==================== COLUMN 3: DISCRIMINATOR NETWORK ==================== -->
  <g transform="translate(740, 178)">
    <!-- Container -->
    <rect width="170" height="152" rx="8" fill="#23272B" stroke="url(#discBorder)" stroke-width="1.2"/>
    <rect x="0" y="0" width="170" height="3" rx="1" fill="#4DABCF"/>

    <!-- Title Badge -->
    <rect x="12" y="10" width="125" height="18" rx="3" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="74.5" y="22.5" fill="#4DABCF" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5" class="font-sans">DISCRIMINATOR D(x, y)</text>

    <!-- Layers -->
    <g transform="translate(10, 38)">
      <!-- Layer 1 -->
      <rect width="150" height="26" rx="4" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="8" y="17" fill="#F7F6F2" font-size="9.5" font-weight="600" class="font-mono">Linear (794 → 256)</text>
      <text x="142" y="17" fill="#4DABCF" font-size="8.5" text-anchor="end" class="font-mono">LReLU</text>

      <!-- Layer 2 -->
      <rect y="32" width="150" height="26" rx="4" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="8" y="49" fill="#F7F6F2" font-size="9.5" font-weight="600" class="font-mono">Linear (256 → 128)</text>
      <text x="142" y="49" fill="#4DABCF" font-size="8.5" text-anchor="end" class="font-mono">LReLU</text>

      <!-- Layer 3 -->
      <rect y="64" width="150" height="26" rx="4" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="8" y="81" fill="#F7F6F2" font-size="9.5" font-weight="600" class="font-mono">Linear (128 → 1)</text>
      <text x="142" y="81" fill="#4DABCF" font-size="8.5" text-anchor="end" class="font-mono">Sigmoid</text>

      <!-- Output prediction -->
      <text x="75" y="105" fill="#F7F6F2" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">D(x|y) ∈ [0, 1]</text>
    </g>
  </g>

  <!-- ==================== BOTTOM PANEL: OBJECTIVE & ADVERSARIAL LOSS ==================== -->
  <g transform="translate(290, 245)">
    <rect width="342" height="135" rx="8" fill="#23272B" stroke="#363C42" stroke-width="1"/>
    <rect x="0" y="0" width="342" height="2" rx="1" fill="#E07A5F"/>

    <!-- Header Badge -->
    <rect x="12" y="10" width="145" height="18" rx="3" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="84.5" y="22.5" fill="#E07A5F" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5" class="font-sans">LOSS &amp; FEEDBACK LOOP</text>

    <!-- Loss Equation -->
    <text x="12" y="48" fill="#F7F6F2" font-size="10.5" font-weight="600" class="font-mono">Criterion: nn.BCELoss()</text>
    <text x="12" y="68" fill="#B5B0A6" font-size="9.5" class="font-mono">L_D = -E[log D(x|y)] - E[log(1 - D(G(z|y)|y))]</text>
    <text x="12" y="86" fill="#E07A5F" font-size="9.5" class="font-mono">L_G = -E[log D(G(z|y)|y)] (Non-saturating)</text>

    <line x1="12" y1="96" x2="330" y2="96" stroke="#2D3339" stroke-width="0.8"/>

    <!-- Optimizer metadata -->
    <text x="12" y="112" fill="#F7F6F2" font-size="9.5" font-weight="600" class="font-mono">Optimizers: Adam(lr=3e-4, betas=(0.9, 0.999))</text>
    <text x="12" y="126" fill="#9E998F" font-size="9" class="font-mono">Independent alternating gradient step per batch</text>
  </g>

  <!-- Adversarial Feedback Arrows -->
  <path d="M 825 330 L 825 395 L 460 395 L 460 382" stroke="#4DABCF" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="640" y="410" fill="#4DABCF" font-size="9" text-anchor="middle" class="font-mono">∇θ_D backprop on real &amp; fake batches</text>

  <path d="M 330 245 L 330 220" stroke="#E07A5F" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowTerracotta)"/>
  <text x="350" y="235" fill="#E07A5F" font-size="8.5" class="font-mono">∇θ_G step</text>

</svg>
