<svg width="100%" height="auto" viewBox="0 0 1000 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrowTerracotta" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#E07A5F" />
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#B5B0A6" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#4DABCF" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="genBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#363C42" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="discBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DABCF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#363C42" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'Cascadia Code', Consolas, Menlo, Monaco, monospace; }
  </style>

  <!-- Canvas Base -->
  <rect width="1000" height="480" rx="12" fill="#191C1E" stroke="#363C42" stroke-width="1.2"/>

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(35, 22)">
    <rect width="195" height="22" rx="4" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="97.5" y="15" fill="#E07A5F" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.8" class="font-sans">cGAN DATAFLOW &amp; ARCHITECTURE</text>
    
    <text x="215" y="16" fill="#F7F6F2" font-size="14" font-weight="600" class="font-sans">End-to-End Conditioning &amp; Adversarial Pipeline</text>
    <text x="930" y="15" fill="#9E998F" font-size="10" text-anchor="end" class="font-mono">z_dim=64 • classes=10 • img_dim=784</text>
  </g>

  <line x1="35" y1="56" x2="965" y2="56" stroke="#2D3339" stroke-width="1"/>

  <!-- ==================== COLUMN 1: INPUT CONDITIONING ==================== -->
  <!-- 1. Latent Vector Box -->
  <g transform="translate(35, 75)">
    <rect width="155" height="68" rx="6" fill="#23272B" stroke="#363C42" stroke-width="1"/>
    <rect x="12" y="8" width="80" height="16" rx="3" fill="#2D3339"/>
    <text x="52" y="19.5" fill="#F7F6F2" font-size="8.5" font-weight="600" text-anchor="middle" class="font-mono">LATENT NOISE</text>
    <text x="12" y="42" fill="#F7F6F2" font-size="12" font-weight="600" class="font-mono">z ~ N(0, I)</text>
    <text x="12" y="58" fill="#9E998F" font-size="9.5" class="font-mono">Dimension: 64-d</text>
  </g>

  <!-- 2. Target Class Label Box -->
  <g transform="translate(35, 155)">
    <rect width="155" height="68" rx="6" fill="#23272B" stroke="#E07A5F" stroke-width="1" stroke-opacity="0.85"/>
    <rect x="12" y="8" width="76" height="16" rx="3" fill="#2D3339"/>
    <text x="50" y="19.5" fill="#E07A5F" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">CLASS LABEL</text>
    <text x="12" y="42" fill="#F7F6F2" font-size="12" font-weight="600" class="font-mono">y ∈ {0 .. 9}</text>
    <text x="12" y="58" fill="#E07A5F" font-size="9.5" class="font-mono">One-Hot (10-d)</text>
  </g>

  <!-- 3. Real MNIST Dataset Box -->
  <g transform="translate(35, 260)">
    <rect width="155" height="74" rx="6" fill="#23272B" stroke="#363C42" stroke-width="1"/>
    <rect x="12" y="8" width="82" height="16" rx="3" fill="#2D3339"/>
    <text x="53" y="19.5" fill="#4DABCF" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">REAL DATASET</text>
    <text x="12" y="44" fill="#F7F6F2" font-size="12" font-weight="600" class="font-sans">MNIST Real x</text>
    <text x="12" y="62" fill="#9E998F" font-size="9.5" class="font-mono">28×28 Grayscale (784-d)</text>
  </g>

  <!-- 4. Real Class Label Box -->
  <g transform="translate(35, 346)">
    <rect width="155" height="68" rx="6" fill="#23272B" stroke="#4DABCF" stroke-width="1" stroke-opacity="0.85"/>
    <rect x="12" y="8" width="108" height="16" rx="3" fill="#2D3339"/>
    <text x="66" y="19.5" fill="#4DABCF" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">REAL CLASS y_real</text>
    <text x="12" y="42" fill="#F7F6F2" font-size="12" font-weight="600" class="font-mono">y_real ∈ {0 .. 9}</text>
    <text x="12" y="58" fill="#4DABCF" font-size="9.5" class="font-mono">One-Hot (10-d)</text>
  </g>

  <!-- Connectors: z and y to Generator Concat -->
  <path d="M 190 109 L 214 109 L 214 137 L 224 137" stroke="#B5B0A6" stroke-width="1.2" fill="none" marker-end="url(#arrowMuted)"/>
  <path d="M 190 189 L 214 189 L 214 159 L 224 159" stroke="#E07A5F" stroke-width="1.2" fill="none" marker-end="url(#arrowTerracotta)"/>

  <!-- Concatenation Pill (Generator - Wide with comfortable internal padding) -->
  <g transform="translate(230, 127)">
    <rect width="58" height="42" rx="7" fill="#2D3339" stroke="#E07A5F" stroke-width="1.2"/>
    <text x="29" y="26" fill="#E07A5F" font-size="13" font-weight="700" text-anchor="middle" class="font-mono">[ ; ]</text>
    <text x="29" y="56" fill="#9E998F" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">74-d</text>
  </g>
  <path d="M 288 148 L 300 148" stroke="#E07A5F" stroke-width="1.2" fill="none" marker-end="url(#arrowTerracotta)"/>

  <!-- ==================== COLUMN 2: GENERATOR NETWORK ==================== -->
  <g transform="translate(305, 68)">
    <rect width="215" height="160" rx="8" fill="#23272B" stroke="url(#genBorder)" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="3" rx="1" fill="#E07A5F"/>

    <!-- Title Badge -->
    <rect x="14" y="12" width="112" height="18" rx="3" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="70" y="24.5" fill="#E07A5F" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5" class="font-sans">GENERATOR G(z, y)</text>

    <!-- Layers -->
    <g transform="translate(14, 40)">
      <!-- Layer 1 -->
      <rect width="187" height="26" rx="4" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="10" y="17" fill="#F7F6F2" font-size="9.5" font-weight="600" class="font-mono">Linear (74 → 256)</text>
      <text x="177" y="17" fill="#E07A5F" font-size="8.5" text-anchor="end" class="font-mono">LeakyReLU</text>

      <!-- Layer 2 -->
      <rect y="32" width="187" height="26" rx="4" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="10" y="49" fill="#F7F6F2" font-size="9.5" font-weight="600" class="font-mono">Linear (256 → 512)</text>
      <text x="177" y="49" fill="#E07A5F" font-size="8.5" text-anchor="end" class="font-mono">LeakyReLU</text>

      <!-- Layer 3 -->
      <rect y="64" width="187" height="26" rx="4" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="10" y="81" fill="#F7F6F2" font-size="9.5" font-weight="600" class="font-mono">Linear (512 → 784)</text>
      <text x="177" y="81" fill="#E07A5F" font-size="8.5" text-anchor="end" class="font-mono">Tanh</text>

      <!-- Reshape note -->
      <text x="93.5" y="108" fill="#9E998F" font-size="9" text-anchor="middle" class="font-mono">reshape: (Batch, 1, 28, 28)</text>
    </g>
  </g>

  <!-- Output Arrow to Synthetic Image Box -->
  <path d="M 520 148 L 548 148" stroke="#E07A5F" stroke-width="1.2" fill="none" marker-end="url(#arrowTerracotta)"/>

  <!-- Synthetic Image Box (Width increased to 135px with plenty of padding) -->
  <g transform="translate(554, 112)">
    <rect width="135" height="72" rx="6" fill="#23272B" stroke="#E07A5F" stroke-width="1.2"/>
    <rect x="12" y="8" width="111" height="16" rx="3" fill="#2D3339"/>
    <text x="67.5" y="19.5" fill="#E07A5F" font-size="8.5" font-weight="700" text-anchor="middle" class="font-mono">SYNTHETIC SAMPLE</text>
    <text x="67.5" y="44" fill="#F7F6F2" font-size="11.5" font-weight="600" text-anchor="middle" class="font-mono">x_fake = G(z, y)</text>
    <text x="67.5" y="60" fill="#9E998F" font-size="9" text-anchor="middle" class="font-mono">28×28 Grayscale (784-d)</text>
  </g>

  <!-- ==================== CLEAR ROUTING TO DISCRIMINATOR CONCAT ==================== -->
  <!-- 1. Synthetic image path: loops to Discriminator Concat Top -->
  <path d="M 689 148 L 730 148 L 730 207 L 738 207" stroke="#E07A5F" stroke-width="1.2" fill="none" marker-end="url(#arrowTerracotta)"/>

  <!-- 2. Real image path: routes horizontally with distinct vertical corridor -->
  <path d="M 190 297 L 702 297 L 702 221 L 738 221" stroke="#4DABCF" stroke-width="1.2" fill="none" marker-end="url(#arrowCyan)"/>

  <!-- 3. Real class label path: runs on bottom corridor with distinct spacing -->
  <path d="M 190 380 L 716 380 L 716 235 L 738 235" stroke="#B5B0A6" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrowMuted)"/>

  <!-- Concatenation Pill (Discriminator - Wide with comfortable internal padding) -->
  <g transform="translate(744, 196)">
    <rect width="58" height="46" rx="7" fill="#2D3339" stroke="#4DABCF" stroke-width="1.2"/>
    <text x="29" y="28" fill="#4DABCF" font-size="13" font-weight="700" text-anchor="middle" class="font-mono">[ ; ]</text>
    <text x="29" y="60" fill="#9E998F" font-size="9.5" font-weight="600" text-anchor="middle" class="font-mono">794-d</text>
  </g>
  <path d="M 802 221 L 817 221" stroke="#4DABCF" stroke-width="1.2" fill="none" marker-end="url(#arrowCyan)"/>

  <!-- ==================== COLUMN 3: DISCRIMINATOR NETWORK ==================== -->
  <g transform="translate(822, 142)">
    <rect width="145" height="154" rx="8" fill="#23272B" stroke="url(#discBorder)" stroke-width="1.2"/>
    <rect x="0" y="0" width="145" height="3" rx="1" fill="#4DABCF"/>

    <!-- Title Badge -->
    <rect x="10" y="10" width="125" height="18" rx="3" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="72.5" y="22.5" fill="#4DABCF" font-size="8.5" font-weight="700" text-anchor="middle" letter-spacing="0.4" class="font-sans">DISCRIMINATOR D(x, y)</text>

    <!-- Layers -->
    <g transform="translate(10, 36)">
      <!-- Layer 1 -->
      <rect width="125" height="24" rx="3" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="6" y="16" fill="#F7F6F2" font-size="8.5" font-weight="600" class="font-mono">Lin (794→256)</text>
      <text x="119" y="16" fill="#4DABCF" font-size="8" text-anchor="end" class="font-mono">LReLU</text>

      <!-- Layer 2 -->
      <rect y="29" width="125" height="24" rx="3" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="6" y="45" fill="#F7F6F2" font-size="8.5" font-weight="600" class="font-mono">Lin (256→128)</text>
      <text x="119" y="45" fill="#4DABCF" font-size="8" text-anchor="end" class="font-mono">LReLU</text>

      <!-- Layer 3 -->
      <rect y="58" width="125" height="24" rx="3" fill="#1B1E21" stroke="#363C42" stroke-width="0.8"/>
      <text x="6" y="74" fill="#F7F6F2" font-size="8.5" font-weight="600" class="font-mono">Lin (128→1)</text>
      <text x="119" y="74" fill="#4DABCF" font-size="8" text-anchor="end" class="font-mono">Sigmoid</text>

      <!-- Output prediction -->
      <rect y="88" width="125" height="20" rx="3" fill="#23272B" stroke="#363C42" stroke-width="0.8"/>
      <text x="62.5" y="101.5" fill="#F7F6F2" font-size="9" font-weight="700" text-anchor="middle" class="font-mono">D(x|y) ∈ [0, 1]</text>
    </g>
  </g>

  <!-- ==================== BOTTOM PANEL: OBJECTIVE & ADVERSARIAL LOSS ==================== -->
  <g transform="translate(305, 252)">
    <rect width="384" height="162" rx="8" fill="#23272B" stroke="#363C42" stroke-width="1"/>
    <rect x="0" y="0" width="384" height="2" rx="1" fill="#E07A5F"/>

    <!-- Header Badge -->
    <rect x="14" y="12" width="150" height="18" rx="3" fill="#2D3339" stroke="#363C42" stroke-width="0.8"/>
    <text x="89" y="24.5" fill="#E07A5F" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="0.5" class="font-sans">LOSS &amp; FEEDBACK LOOP</text>

    <!-- Loss Equation -->
    <text x="14" y="52" fill="#F7F6F2" font-size="10.5" font-weight="600" class="font-mono">Objective Criterion: nn.BCELoss()</text>
    <text x="14" y="74" fill="#B5B0A6" font-size="9.5" class="font-mono">L_D = -E[log D(x|y)] - E[log(1 - D(G(z|y)|y))]</text>
    <text x="14" y="94" fill="#E07A5F" font-size="9.5" class="font-mono">L_G = -E[log D(G(z|y)|y)] (Non-saturating)</text>

    <line x1="14" y1="106" x2="370" y2="106" stroke="#2D3339" stroke-width="0.8"/>

    <!-- Optimizer metadata -->
    <text x="14" y="124" fill="#F7F6F2" font-size="9.5" font-weight="600" class="font-mono">Optimizers: Adam(lr=3e-4, betas=(0.9, 0.999))</text>
    <text x="14" y="142" fill="#9E998F" font-size="9" class="font-mono">Alternating min-max updates on discriminator &amp; generator</text>
  </g>

  <!-- Adversarial Feedback Arrows -->
  <path d="M 894 300 L 894 435 L 515 435 L 515 418" stroke="#4DABCF" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="704" y="450" fill="#4DABCF" font-size="9" text-anchor="middle" class="font-mono">∇θ_D backpropagation step</text>

  <path d="M 345 252 L 345 232" stroke="#E07A5F" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowTerracotta)"/>
  <text x="365" y="244" fill="#E07A5F" font-size="8.5" class="font-mono">∇θ_G step</text>

</svg>
